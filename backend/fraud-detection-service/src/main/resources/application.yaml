
spring:
  application:
    name: fraud-detection-service
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-server: localhost:9092
    consumer:
      group-id: account-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserialized: org.springframework.kafka.support.serializer.jsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                header: false
            value:
              default:
                type: java.util.HashMap

    producer:
      key-deserializer: org.apache.kafka.common.serialization.StringSerializer
      value-deserialized: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8084

# Account Service

account:
  service:
    url: http:// localhost:8081

fraud:
  max-transaction-per-minute: 5
  suspicious-amount-multiplier: 5
  max-balance-percentage: 0.90

management:
  endpoints:
    web:
      exposure:
        include: health,info

