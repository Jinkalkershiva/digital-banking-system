spring:
  application:
    name: api-gateway-service

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        # Auth service routes
        - id: auth-service
          uri: http://localhost:8088
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/v1/auth/**
                  - /register
                  - /login

        # Account service routes
        - id: account-service
          uri: http://localhost:8081
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/v1/accounts
                  - /api/v1/accounts/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@keyResolver}"

        # Transaction service routes
        - id: transaction-service
          uri: http://localhost:8082
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/v1/transactions
                  - /api/v1/transactions/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@keyResolver}"

        # Payment service routes
        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/v1/payments
                  - /api/v1/payments/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@keyResolver}"

        # Fraud detection service routes
        - id: fraud-service
          uri: http://localhost:8084
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/v1/fraud
                  - /api/v1/fraud/**

        # Notification service routes
        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/v1/notifications
                  - /api/v1/notifications/**

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B597020

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.http.server.reactive: INFO